<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .label { font-size: 19px; fill: #8b949e; }
    .value { font-size: 21px; fill: #c9d1d9; }
    .cmd { font-size: 21px; fill: #7ee787; font-weight: 700; }
    .accent { fill: #79c0ff; }
  </style>

  <rect x="2" y="2" rx="18" width="1196" height="356" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="36" y="48" class="mono cmd">$ jq . stack.json</text>

  <text x="55" y="95" class="mono value">{</text>

  <text x="85" y="132" class="mono label">"cloud"</text>
  <text x="250" y="132" class="mono value">: ["AWS", "Azure"],</text>

  <text x="85" y="170" class="mono label">"platform"</text>
  <text x="250" y="170" class="mono value">: ["Kubernetes", "EKS", "Crossplane", "Argo CD"],</text>

  <text x="85" y="208" class="mono label">"iac"</text>
  <text x="250" y="208" class="mono value">: ["Terraform", "Ansible"],</text>

  <text x="85" y="246" class="mono label">"observability"</text>
  <text x="250" y="246" class="mono value">: ["Prometheus", "Grafana", "Loki", "OpenTelemetry"],</text>

  <text x="85" y="284" class="mono label">"code"</text>
  <text x="250" y="284" class="mono value">: ["Python", "Go", "Bash", "Linux"]</text>

  <text x="55" y="322" class="mono value">}</text>
</svg>